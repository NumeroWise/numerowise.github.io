<!-- ==========================================
NumeroWise
Common User Fields
Used in all report forms
========================================== -->

<div class="form-group">

<label>
Full Name
<span class="required">*</span>
</label>

<input
type="text"
id="fullName"
required>

</div>


<div class="form-group">

<label>
Date of Birth
<span class="required">*</span>
</label>

<input
type="date"
id="dob"
required>

</div>


<div class="form-group">

<label>
E-mail Address
<span class="required">*</span>
</label>

<input
type="email"
id="email"
required>

</div>


<div class="form-group">

<label>
Country
<span class="required">*</span>
</label>

<select
id="country"
required>

<option value="">
Select Country
</option>

<option>India</option>

<option>United States</option>

<option>United Kingdom</option>

<option>Canada</option>

<option>Australia</option>

<option>United Arab Emirates</option>

<option>Singapore</option>

<option>New Zealand</option>

<option>South Africa</option>

<option>Germany</option>

<option>France</option>

<option>Netherlands</option>

<option>Malaysia</option>

<option>Other</option>

</select>

</div>


<div class="form-group">

<label>
Preferred Language
<span class="required">*</span>
</label>

<select
id="language"
required>

<option value="">
Select Language
</option>

<option value="English">
English
</option>

<option value="Hindi">
Hindi
</option>

</select>

</div>
