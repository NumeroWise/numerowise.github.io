<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wealth Prediction Calculator | NumeroWise</title>

<meta name="description" content="Calculate your Wealth Number and discover your money potential, financial strengths, wealth-building habits, and prosperity path through numerology.">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="header"></div>

<div class="container">

<h1>Wealth Prediction Calculator</h1>

<div class="subtitle">
Discover your numerology-based wealth potential and financial success pattern.
</div>

<div class="card">

<label>Date of Birth</label>

<input
type="date"
id="dob">

<button onclick="calculateWealth()">
Calculate Wealth Number
</button>

<div class="result" id="resultBox">

<div class="label">
Your Wealth Number
</div>

<div
class="number"
id="wealthNumber"
onclick="openWealthPage()">
</div>

<div class="result-summary">
Your Wealth Number reveals your financial strengths, earning potential and prosperity patterns. CLICK Wealth Number to Know More...
</div>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let wealthResult = 0;

/* REDUCE NUMBER */

function reduceNumber(num){

while(num > 9){

let sum = 0;

num.toString().split('').forEach(d => {

sum += parseInt(d);

});

num = sum;

}

return num;

}

/* CALCULATE WEALTH NUMBER */

function calculateWealth(){

const dob =
document.getElementById("dob").value;

if(!dob){

alert("Please enter your Date of Birth.");

return;

}

let digits =
dob.replace(/-/g,'');

let total = 0;

for(let i = 0; i < digits.length; i++){

total += parseInt(digits[i]);

}

wealthResult =
reduceNumber(total);

document
.getElementById("wealthNumber")
.innerHTML = wealthResult;

document
.getElementById("resultBox")
.style.display = "block";

}

/* OPEN REPORT PAGE */

function openWealthPage(){

if(wealthResult > 0){

window.location.href =
"wealth-number-" +
wealthResult +
".html";

}

}

/* HEADER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

/* FOOTER */

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
</html>
