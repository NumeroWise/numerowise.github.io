<script>

let finalNumber = null;

/* REDUCE TO SINGLE DIGIT */

function reduceToSingleDigit(num) {

  while (num > 9) {

    num = num
      .toString()
      .split('')
      .reduce(
        (sum, digit) =>
        sum + Number(digit),
        0
      );

  }

  return num;
}

/* SOUL URGE CALCULATION */

function calculateSoulUrge() {

  let name =
    document
    .getElementById("fullName")
    .value
    .toUpperCase()
    .trim();

  if (!name) {

    alert("Please enter your Full Name");

    return;

  }

  const vowelValues = {

    A: 1,
    E: 5,
    I: 9,
    O: 6,
    U: 3

  };

  let total = 0;

  for (let char of name) {

    if (vowelValues[char]) {

      total += vowelValues[char];

    }

  }

  if (total === 0) {

    alert("Please enter a valid name");

    return;

  }

  finalNumber =
    reduceToSingleDigit(total);

  document
    .getElementById("soulUrgeNumber")
    .innerText = finalNumber;

  document
    .getElementById("summary")
    .innerText =
    "Your Soul Urge Number reveals your deepest desires, emotional needs, and inner motivations. CLICK Soul Urge Number to Know More...";

  document
    .getElementById("resultBox")
    .style.display = "block";

}

/* OPEN REPORT PAGE */

function goDetail() {

  if (finalNumber !== null) {

    window.location.href =
      "soul-urge-number-" +
      finalNumber +
      ".html";

  }

}

</script>
