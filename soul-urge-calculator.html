<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soul Urge Number Calculator | NumeroWise</title>

<meta name="description" content="Calculate your Soul Urge Number using your full name. Discover your inner desires, motivations, and emotional needs with NumeroWise.">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="header"></div>

<div class="container">

<h1>Soul Urge Number Calculator</h1>

<div class="subtitle">
Discover your inner desires, motivations and heart's true calling
</div>

<div class="card">

<input
type="text"
id="fullName"
placeholder="Enter Full Name">

<button onclick="calculateSoulUrge()">
Calculate Soul Urge Number
</button>

<div class="result" id="resultBox">

<div class="label">
Your Soul Urge Number
</div>

<div
class="number"
id="soulUrgeNumber"
onclick="goDetail()">
</div>

<div class="result-summary" id="summary">
Your Soul Urge Number reveals your deepest desires, emotional needs, and inner motivations. CLICK Soul Urge Number to Know More...
</div>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let finalNumber = null;

/* REDUCE TO SINGLE DIGIT */

function reduceToSingleDigit(num){

while(num > 9){

num = num
.toString()
.split('')
.reduce(
(sum, digit) => sum + Number(digit),
0
);

}

return num;

}

/* SOUL URGE CALCULATION */

function calculateSoulUrge(){

let name =
document
.getElementById("fullName")
.value
.toUpperCase()
.trim();

if(!name){

alert("Please enter your Full Name");

return;

}

const vowelValues = {

A:1,
E:5,
I:9,
O:6,
U:3

};

let total = 0;

for(let char of name){

if(vowelValues[char]){

total += vowelValues[char];

}

}

if(total === 0){

alert("Please enter a valid name");

return;

}

finalNumber =
reduceToSingleDigit(total);

document
.getElementById("soulUrgeNumber")
.innerText = finalNumber;

document
.getElementById("resultBox")
.style.display = "block";

}

/* OPEN REPORT PAGE */

function goDetail(){

if(finalNumber !== null){

window.location.href =
"soul-urge-number-" +
finalNumber +
".html";

}

}

/* HEADER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

/* FOOTER */

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
</html>
