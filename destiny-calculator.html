<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Destiny Number Calculator | NumeroWise</title>

<meta name="description" content="Calculate your Destiny Number using your full birth name and discover your life direction according to numerology.">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="header"></div>

<div class="container">

<h1>Destiny Number Calculator</h1>

<div class="subtitle">
Discover your life direction through your full birth name.
</div>

<div class="card">

<label>Full Birth Name</label>

<input
type="text"
id="fullName"
placeholder="Enter your full birth name">

<button onclick="calculateDestiny()">
Calculate Destiny Number
</button>

<div class="result" id="resultBox">

<h2>Your Destiny Number Is</h2>

<div
class="number"
id="destinyNumber"
onclick="openDestinyPage()">
</div>

<div class="result-summary">
Click the number to read your detailed report.
</div>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let destinyResult = 0;

const values = {
A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,
J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,
S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8
};

function reduceNumber(num){

while(num > 9){

let sum = 0;

num.toString().split('').forEach(d => {
sum += parseInt(d);
});

num = sum;

}

return num;

}

function calculateDestiny(){

let name =
document.getElementById("fullName")
.value
.toUpperCase()
.replace(/[^A-Z]/g,'');

if(name === ""){

alert("Please enter your full birth name.");

return;

}

let total = 0;

for(let i = 0; i < name.length; i++){

total += values[name[i]];

}

destinyResult = reduceNumber(total);

document.getElementById("destinyNumber")
.innerHTML = destinyResult;

document.getElementById("resultBox")
.style.display = "block";

}

function openDestinyPage(){

if(destinyResult > 0){

window.location.href =
"destiny-number-" +
destinyResult +
".html";

}

}

/* HEADER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

/* FOOTER */

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
</html>
