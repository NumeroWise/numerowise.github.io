<body>

<div id="header"></div>

<div class="container">

<h1>Destiny Number Calculator</h1>

<div class="subtitle">
Discover your life direction through your full birth name.
</div>

<div class="card">

<input
type="text"
id="fullName"
placeholder="Enter Full Birth Name">

<button onclick="calculateDestiny()">
Calculate Destiny Number
</button>

<div class="result" id="resultBox">

<div class="label">
Your Destiny Number
</div>

<div
class="number"
id="destinyNumber"
onclick="openDestinyPage()">
</div>

<div
id="summary"
class="result-summary">
</div>

<div class="related-links">

<h3>Learn More</h3>

<p>

<a href="what-is-destiny-number.html">
What is Destiny Number?
</a>

</p>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let destinyResult = 0;

const values = {
A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,
J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,
S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8
};

function reduceNumber(num){

while(num > 9){

let sum = 0;

num.toString().split('').forEach(d => {
sum += parseInt(d);
});

num = sum;

}

return num;

}

function calculateDestiny(){

let name =
document.getElementById("fullName")
.value
.toUpperCase()
.replace(/[^A-Z]/g,'');

if(name === ""){

alert("Please enter your full birth name.");

return;

}

let total = 0;

for(let i = 0; i < name.length; i++){

total += values[name[i]];

}

destinyResult = reduceNumber(total);

document.getElementById("destinyNumber")
.innerHTML = destinyResult;

document
.getElementById("summary")
.innerHTML =

'Your <b>Destiny Number</b> reveals your natural talents, life direction and hidden potential.<br><br><b>Click on your Destiny Number above to read the complete interpretation.</b>';
  
document.getElementById("resultBox")
.style.display = "block";

}

function openDestinyPage(){

if(destinyResult > 0){

window.location.href =
"destiny-number-" +
destinyResult +
".html";

}

}

/* HEADER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

/* FOOTER */

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
