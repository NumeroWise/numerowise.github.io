<body>

<div class="container">

<div class="nav">
<a href="index.html">Home</a>
<a href="what-is-destiny-number.html">Guide</a>
<a href="life-path-calculator.html">Life Path</a>
</div>

<h1>Destiny Number Calculator</h1>

<div class="subtitle">
Discover your life direction through your full birth name.
</div>

<div class="card">

<label>Full Birth Name</label>
<input type="text" id="fullName" placeholder="Enter your full birth name">

<button onclick="calculateDestiny()">
Calculate Destiny Number
</button>

<div class="result" id="resultBox">

<h2>Your Destiny Number Is</h2>

<div class="number"
id="destinyNumber"
onclick="openDestinyPage()">
</div>

<div class="note">
Click the number to read your detailed report.
</div>

</div>

<div class="footer">
 <p>
<center>© 2026 NumeroWise | AI Powered Numerology Calculator for Life Path, Destiny, Soul Urge & Personality Numbers</center>
</p>
</div>

<script>

let destinyResult = 0;

const values = {
A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,
J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,
S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8
};

function reduceNumber(num){

while(num > 9){
let sum = 0;

num.toString().split('').forEach(d=>{
sum += parseInt(d);
});

num = sum;
}

return num;
}

function calculateDestiny(){

let name =
document.getElementById("fullName")
.value
.toUpperCase()
.replace(/[^A-Z]/g,'');

if(name===""){
alert("Please enter your full birth name.");
return;
}

let total = 0;

for(let i=0;i<name.length;i++){
total += values[name[i]];
}

destinyResult = reduceNumber(total);

document.getElementById("destinyNumber")
.innerHTML = destinyResult;

document.getElementById("resultBox")
.style.display="block";
}

function openDestinyPage(){

if(destinyResult>0){

window.location.href =
"destiny-number-"+destinyResult+".html";

}

}

</script>
