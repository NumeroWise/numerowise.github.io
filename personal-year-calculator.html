<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Year Calculator | NumeroWise</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #1a1a2e, #0f0c29, #000);
  color: white;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 40px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: none;
}

button {
  padding: 12px 20px;
  background: #ffd700;
  border: none;
  cursor: pointer;
  font-weight: bold;
  border-radius: 8px;
}

.result {
  margin-top: 20px;
  font-size: 22px;
  color: #00e5ff;
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🔮 Personal Year Calculator</h1>

<input type="date" id="dob">
<button onclick="calculate()">Calculate</button>

<div class="result" id="resultBox">
Your Personal Year Number: <span id="result"></span>
<br><br>
<button onclick="goDetail()">View Full Reading</button>
</div>

</div>

<script>

let finalNumber = null;

/* REDUCTION */
function reduce(num){
  while(num > 9){
    num = num.toString().split('').reduce((a,b)=>a+Number(b),0);
  }
  return num;
}

/* PERSONAL YEAR CALC */
function calculate(){
  let dob = document.getElementById("dob").value;
  if(!dob){
    alert("Enter DOB");
    return;
  }

  let year = new Date().getFullYear();

  let [y,m,d] = dob.split("-");

  let sum =
    Number(d) + Number(m) +
    year.toString().split('').reduce((a,b)=>a+Number(b),0);

  finalNumber = reduce(sum);

  document.getElementById("result").innerText = finalNumber;
  document.getElementById("resultBox").style.display = "block";
}

/* REDIRECT */
function goDetail(){
  window.location.href = "personal-year-number-" + finalNumber + ".html";
}

</script>

</body>
</html>
