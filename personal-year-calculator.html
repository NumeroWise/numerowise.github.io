<body>

<div id="header"></div>

<div class="container">

<h1>Personal Year Calculator</h1>

<div class="subtitle">
Discover the energy and opportunities shaping your current year
</div>

<div class="card">

<input
type="date"
id="dob">

<button onclick="calculate()">
Calculate Personal Year Number
</button>

<div class="result" id="resultBox">

<div class="label">
Your Personal Year Number
</div>

<div
class="number"
id="result"
onclick="goDetail()">
</div>

<div class="result-summary">
Your Personal Year Number reveals the opportunities, challenges and lessons influencing your current year. CLICK Personal Year Number to Know More...
</div>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let finalNumber = null;

/* REDUCE */

function reduce(num){

while(num > 9){

num = num
.toString()
.split('')
.reduce(
(a,b)=>a + Number(b),
0
);

}

return num;

}

/* PERSONAL YEAR CALC */

function calculate(){

let dob =
document.getElementById("dob").value;

if(!dob){

alert("Please enter your Date of Birth");

return;

}

let year =
new Date().getFullYear();

let [y,m,d] =
dob.split("-");

let sum =

Number(d) +
Number(m) +

year
.toString()
.split('')
.reduce(
(a,b)=>a + Number(b),
0
);

finalNumber =
reduce(sum);

document
.getElementById("result")
.innerText = finalNumber;

document
.getElementById("resultBox")
.style.display = "block";

}

/* REDIRECT */

function goDetail(){

if(finalNumber !== null){

window.location.href =
"personal-year-" +
finalNumber +
".html";

}

}

/* HEADER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

/* FOOTER */

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
