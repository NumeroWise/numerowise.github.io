<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Number Calculator | NumeroWise</title>

<meta name="description" content="Calculate your Birthday Number and discover your natural talents, gifts, strengths, and hidden abilities with NumeroWise.">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="header"></div>

<div class="container">

<h1>Birthday Number Calculator</h1>

<div class="subtitle">
Discover your natural talents and hidden gifts through numerology
</div>

<div class="card">

<input
type="text"
id="name"
placeholder="Enter Full Name">

<input
type="date"
id="dob">

<button onclick="calculateBirthday()">
Calculate Birthday Number
</button>

<div class="result" id="resultBox">

<div class="label">
Your Birthday Number
</div>

<div
class="number"
id="birthdayNumber"
onclick="goDetail()">
</div>

<div class="result-summary" id="summary">
Your Birthday Number reveals your natural talents, gifts, strengths and abilities. CLICK Birthday Number to Know More...
</div>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let finalNumber = null;

/* Reduce to Single Digit */

function reduceToSingleDigit(num){

num = parseInt(num);

while(num > 9){

num = num
.toString()
.split('')
.reduce(
(sum,digit)=>sum + Number(digit),
0
);

}

return num;

}

/* Birthday Number */

function birthdayFromDOB(dob){

if(!dob) return null;

let day =
parseInt(
dob.split("-")[2]
);

return reduceToSingleDigit(day);

}

/* Calculate */

function calculateBirthday(){

let name =
document.getElementById("name").value;

let dob =
document.getElementById("dob").value;

if(!name || !dob){

alert(
"Please enter both Name and Date of Birth"
);

return;

}

finalNumber =
birthdayFromDOB(dob);

document
.getElementById("birthdayNumber")
.innerText = finalNumber;

document
.getElementById("resultBox")
.style.display = "block";

}

/* Open Report */

function goDetail(){

if(finalNumber !== null){

window.location.href =
"birthday-number-" +
finalNumber +
".html";

}

}

/* HEADER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

/* FOOTER */

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
</html>
