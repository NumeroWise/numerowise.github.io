<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Career Number Calculator | NumeroWise</title>

<meta name="description" content="Calculate your Career Number using your date of birth and discover your ideal career path, professional strengths, work style, and success potential according to numerology.">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="header"></div>

<div class="container">

<h1>Career Number Calculator</h1>

<div class="subtitle">
Discover your ideal career path and professional strengths through numerology.
</div>

<div class="card">

<label>Date of Birth</label>

<input
type="date"
id="dob">

<button onclick="calculateCareer()">
Calculate Career Number
</button>

<div class="result" id="resultBox">

<div class="label">
Your Career Number
</div>

<div
class="number"
id="careerNumber"
onclick="openCareerPage()">
</div>

<div class="result-summary">
Your Career Number reveals your ideal professional direction, strengths and success style. CLICK Career Number to Know More...
</div>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let careerResult = 0;

/* REDUCE NUMBER */

function reduceNumber(num){

while(num > 9){

let sum = 0;

num.toString().split('').forEach(d => {

sum += parseInt(d);

});

num = sum;

}

return num;

}

/* CALCULATE CAREER NUMBER */

function calculateCareer(){

let dob =
document.getElementById("dob").value;

if(dob === ""){

alert("Please enter your Date of Birth.");

return;

}

let digits =
dob.replace(/-/g,'');

let total = 0;

for(let i = 0; i < digits.length; i++){

total += parseInt(digits[i]);

}

careerResult =
reduceNumber(total);

document
.getElementById("careerNumber")
.innerHTML = careerResult;

document
.getElementById("resultBox")
.style.display = "block";

}

/* OPEN REPORT PAGE */

function openCareerPage(){

if(careerResult > 0){

window.location.href =
"career-number-" +
careerResult +
".html";

}

}

/* HEADER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

/* FOOTER */

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
</html>
