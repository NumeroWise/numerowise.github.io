<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Path Calculator | NumeroWise</title>

<meta name="description" content="Calculate your Life Path Number and discover your life purpose, strengths, talents, and destiny through numerology.">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="header"></div>

<div class="container">

<h1>Life Path Calculator</h1>

<div class="subtitle">
Discover your life purpose through numbers
</div>

<div class="card">

<input
type="text"
id="name"
placeholder="Enter Full Name">

<input
type="date"
id="dob">

<button onclick="calculate()">
Calculate Life Path
</button>

<div class="result" id="resultBox">

<div class="label">
Your Life Path Number
</div>

<div
class="number"
id="lifePathNumber"
onclick="goDetail()">
</div>

<div
id="summary"
style="margin-top:15px;opacity:0.8;">
</div>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let finalNumber = null;

/* REDUCE TO SINGLE DIGIT */

function reduceToSingleDigit(num){

num = parseInt(num);

while(num > 9){

num = num
.toString()
.split('')
.reduce(
(sum,digit)=>
sum + Number(digit),
0
);

}

return num;

}

/* LIFE PATH FROM DOB */

function lifePathFromDOB(dob){

if(!dob) return null;

let cleaned =
dob.split("-").join("");

let sum =
cleaned
.split("")
.reduce(
(a,b)=>
a + Number(b),
0
);

return reduceToSingleDigit(sum);

}

/* CALCULATE */

function calculate(){

let name =
document
.getElementById("name")
.value;

let dob =
document
.getElementById("dob")
.value;

if(!name || !dob){

alert(
"Please enter both Name and Date of Birth"
);

return;

}

finalNumber =
lifePathFromDOB(dob);

document
.getElementById("lifePathNumber")
.innerText =
finalNumber;

document
.getElementById("summary")
.innerText =
"Your Life Path Number reveals your core life direction. CLICK Life Path Number to Know More...";

document
.getElementById("resultBox")
.style.display =
"block";

}

/* OPEN DETAIL PAGE */

function goDetail(){

if(finalNumber !== null){

window.location.href =
"life-path-number-" +
finalNumber +
".html";

}

}

/* HEADER + FOOTER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
</html>
