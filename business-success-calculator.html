<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Success Numerology Calculator | NumeroWise</title>

<meta name="description" content="Calculate your Business Success Number and discover your business strengths, growth potential, leadership style, and success opportunities through numerology.">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="header"></div>

<div class="container">

<h1>Business Success Calculator</h1>

<div class="subtitle">
Discover your Business Success Number using your business name.
</div>

<div class="card">

<label>Business Name</label>

<input
type="text"
id="businessName"
placeholder="Enter your business name">

<button onclick="calculateBusinessSuccess()">
Calculate Business Success Number
</button>

<div class="result" id="resultBox">

<div class="label">
Your Business Success Number
</div>

<div
class="number"
id="businessNumber"
onclick="openBusinessPage()">
</div>

<div class="result-summary">
Your Business Success Number reveals your business strengths, growth potential and leadership style. CLICK Business Success Number to Know More...
</div>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let businessResult = 0;

const values = {
A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,
J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,
S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8
};

/* REDUCE NUMBER */

function reduceNumber(num){

while(num > 9){

let sum = 0;

num.toString().split('').forEach(d => {

sum += parseInt(d);

});

num = sum;

}

return num;

}

/* CALCULATE BUSINESS SUCCESS */

function calculateBusinessSuccess(){

let name =
document
.getElementById("businessName")
.value
.toUpperCase()
.replace(/[^A-Z]/g,'');

if(name === ""){

alert("Please enter your business name.");

return;

}

let total = 0;

for(let i = 0; i < name.length; i++){

total += values[name[i]];

}

businessResult =
reduceNumber(total);

document
.getElementById("businessNumber")
.innerHTML = businessResult;

document
.getElementById("resultBox")
.style.display = "block";

}

/* OPEN REPORT PAGE */

function openBusinessPage(){

if(businessResult > 0){

window.location.href =
"business-success-number-" +
businessResult +
".html";

}

}

/* HEADER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

/* FOOTER */

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
</html>
