<!DOCTYPE html>
<html>
<head>
<title>NumeroWise</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family:Arial,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
text-align:center;
}
input,button{
padding:10px;
margin:10px;
font-size:16px;
}
.result{
margin-top:20px;
font-size:20px;
font-weight:bold;
}
</style>
</head>
<body>

<h1>NumeroWise</h1>
<p>Discover Your Life Path Number</p>

<input type="date" id="dob">
<br>

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

<script>
function calculate() {
let dob = document.getElementById("dob").value;

if(!dob){
alert("Please select your date of birth");
return;
}

let digits = dob.replace(/-/g,'');

let sum = digits.split('').reduce((a,b)=>a+parseInt(b),0);

while(sum > 9){
sum = sum.toString().split('').reduce((a,b)=>a+parseInt(b),0);
}

let meanings = {
1: "🇬🇧 You are a natural leader with strong independence and determination.<br><br>🇮🇳 आप एक स्वाभाविक नेता हैं। आपमें आत्मनिर्भरता, दृढ़ संकल्प और नेतृत्व करने की क्षमता होती है।",

2: "🇬🇧 You are cooperative, diplomatic, and value harmony in relationships.<br><br>🇮🇳 आप सहयोगी, समझदार और रिश्तों में संतुलन बनाए रखने वाले व्यक्ति हैं।",

3: "🇬🇧 You are creative, expressive, and enjoy inspiring others.<br><br>🇮🇳 आप रचनात्मक, अभिव्यक्तिशील और दूसरों को प्रेरित करने वाले व्यक्ति हैं।",

4: "🇬🇧 You are practical, disciplined, and dedicated to building stability.<br><br>🇮🇳 आप व्यावहारिक, अनुशासित और जीवन में मजबूत आधार बनाने पर केंद्रित रहते हैं।",

5: "🇬🇧 You love freedom, adventure, and adapting to change.<br><br>🇮🇳 आपको स्वतंत्रता, रोमांच और नए अनुभव पसंद हैं। आप बदलावों को आसानी से अपनाते हैं।",

6: "🇬🇧 You are caring, responsible, and focused on family and community.<br><br>🇮🇳 आप जिम्मेदार, दयालु और परिवार व समाज की भलाई को महत्व देने वाले व्यक्ति हैं।",

7: "🇬🇧 You are analytical, spiritual, and enjoy seeking deeper knowledge.<br><br>🇮🇳 आप गहराई से सोचने वाले, आध्यात्मिक और ज्ञान की खोज में रुचि रखने वाले व्यक्ति हैं।",

8: "🇬🇧 You are ambitious, confident, and driven toward success and achievement.<br><br>🇮🇳 आप महत्वाकांक्षी, आत्मविश्वासी और सफलता प्राप्त करने के लिए निरंतर प्रयासरत रहते हैं।",

9: "🇬🇧 You are compassionate, generous, and motivated to help others.<br><br>🇮🇳 आप दयालु, उदार और मानवता की सेवा करने की भावना रखने वाले व्यक्ति हैं।"
};
  
document.getElementById("result").innerHTML =
"<h2>Your Life Path Number is: " + sum + "</h2>" +
"<p>" + meanings[sum] + "</p>";
</script>

</body>
</html>
