<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔢 NumeroWise | AI Numerology Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      color: #ffd700;
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.9;
    }

    input {
      padding: 12px;
      margin: 10px;
      width: 250px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    .btn {
      padding: 12px 25px;
      background: #ffd700;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background: #ffcc00;
    }

    .card-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 20px;
      margin: 10px;
      border-radius: 12px;
      width: 250px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .result {
      margin-top: 30px;
      font-size: 18px;
      line-height: 1.6;
    }

    .highlight {
      color: #00e5ff;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔢 NumeroWise</h1>
  <p>AI-powered Numerology Dashboard for Life Path, Destiny & Soul Insights</p>

  <input type="text" id="name" placeholder="Enter Your Full Name">
  <input type="date" id="dob">

  <br>
  <button class="btn" onclick="generate()">Generate My Report</button>

  <div class="result" id="result"></div>

  <div class="card-container">
    <div class="card">
      <h3>🔢 Life Path</h3>
      <p>Based on Date of Birth</p>
    </div>

    <div class="card">
      <h3>🔮 Destiny Number</h3>
      <p>Based on Full Name</p>
    </div>

    <div class="card">
      <h3>💫 Soul Number</h3>
      <p>Based on Vowels in Name</p>
    </div>
  </div>

</div>

<script>
  // Reduce number to single digit (unless master numbers 11,22,33)
  function reduce(num) {
    while (num > 9 && num !== 11 && num !== 22 && num !== 33) {
      num = num.toString().split('').reduce((a,b)=>a+parseInt(b),0);
    }
    return num;
  }

  // Life Path Number
  function lifePath(dob) {
    let sum = dob.replaceAll("-", "")
                 .split("")
                 .reduce((a,b)=>a+parseInt(b),0);
    return reduce(sum);
  }

  // Pythagorean mapping
  const map = {
    a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,i:9,
    j:1,k:2,l:3,m:4,n:5,o:6,p:7,q:8,r:9,
    s:1,t:2,u:3,v:4,w:5,x:6,y:7,z:8
  };

  // Destiny Number (full name)
  function destiny(name) {
    name = name.toLowerCase().replace(/[^a-z]/g,'');
    let sum = 0;
    for(let char of name){
      sum += map[char] || 0;
    }
    return reduce(sum);
  }

  // Soul Number (vowels only)
  function soul(name) {
    name = name.toLowerCase();
    let vowels = "aeiou";
    let sum = 0;
    for(let char of name){
      if(vowels.includes(char)){
        sum += map[char] || 0;
      }
    }
    return reduce(sum);
  }

  function generate() {
    let name = document.getElementById("name").value;
    let dob = document.getElementById("dob").value;

    if(!name || !dob){
      alert("Please enter both Name and Date of Birth");
      return;
    }

    let lp = lifePath(dob);
    let dn = destiny(name);
    let sn = soul(name);

    document.getElementById("result").innerHTML = `
      <h2>Your Numerology Report</h2>
      <p><span class="highlight">Life Path Number:</span> ${lp}</p>
      <p><span class="highlight">Destiny Number:</span> ${dn}</p>
      <p><span class="highlight">Soul Number:</span> ${sn}</p>

      <hr style="opacity:0.2">

      <p>✨ AI Insight: Your numbers indicate a unique personality pattern combining emotional depth, purpose direction, and inner intuition.</p>
    `;
  }
</script>

</body>
</html>
