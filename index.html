<body>

<div class="container">

<h1>🔢 NumeroWise</h1>

<p class="tagline" id="tagline">
Unlock your personality, strengths, and life purpose through numerology.
</p>

<div class="nav">
<a href="index.html">Home</a> |
<a href="about.html">About</a> |
<a href="contact.html">Contact</a> |
<a href="privacy-policy.html">Privacy Policy</a>

<div class="language-box">
<select id="language">
<option value="en">English</option>
<option value="hi">हिन्दी</option>
</select>
</div>

<div class="input-box">
<input type="date" id="dob">
<br><br>

<button onclick="calculate()" id="calcBtn">
Calculate Life Path Number
</button>
</div>

<div class="result" id="result"></div>

</div>

<footer>
© 2026 NumeroWise. All Rights Reserved.
</footer>

<script>

function calculate(){

let dob = document.getElementById("dob").value;
let language = document.getElementById("language").value;

if(!dob){
alert(language==="en"
? "Please select your date of birth."
: "कृपया अपनी जन्म तिथि चुनें।");
return;
}

let digits = dob.replace(/-/g,'');

let sum = digits.split('').reduce((a,b)=>a+parseInt(b),0);

while(sum > 9){
sum = sum.toString().split('').reduce((a,b)=>a+parseInt(b),0);
}

const englishTitles = {
1:"🏆 Leader Personality",
2:"🤝 Peacemaker Personality",
3:"🎨 Creative Personality",
4:"🛠️ Builder Personality",
5:"✈️ Adventurer Personality",
6:"❤️ Caregiver Personality",
7:"🔮 Seeker Personality",
8:"💰 Achiever Personality",
9:"🌍 Humanitarian Personality"
};

const hindiTitles = {
1:"🏆 नेतृत्वकर्ता व्यक्तित्व",
2:"🤝 सामंजस्यकारी व्यक्तित्व",
3:"🎨 रचनात्मक व्यक्तित्व",
4:"🛠️ निर्माता व्यक्तित्व",
5:"✈️ साहसी व्यक्तित्व",
6:"❤️ संरक्षक व्यक्तित्व",
7:"🔮 ज्ञान खोजी व्यक्तित्व",
8:"💰 उपलब्धि प्राप्तकर्ता व्यक्तित्व",
9:"🌍 मानवतावादी व्यक्तित्व"
};

const englishMeanings = {
1:"You are a natural leader with strong independence and determination.",
2:"You are cooperative, diplomatic, and value harmony in relationships.",
3:"You are creative, expressive, and enjoy inspiring others.",
4:"You are practical, disciplined, and dedicated to building stability.",
5:"You love freedom, adventure, and adapting to change.",
6:"You are caring, responsible, and focused on family and community.",
7:"You are analytical, spiritual, and enjoy seeking deeper knowledge.",
8:"You are ambitious, confident, and driven toward success and achievement.",
9:"You are compassionate, generous, and motivated to help others."
};

const hindiMeanings = {
1:"आप एक स्वाभाविक नेता हैं। आपमें आत्मनिर्भरता, दृढ़ संकल्प और नेतृत्व करने की क्षमता होती है।",
2:"आप सहयोगी, समझदार और रिश्तों में संतुलन बनाए रखने वाले व्यक्ति हैं।",
3:"आप रचनात्मक, अभिव्यक्तिशील और दूसरों को प्रेरित करने वाले व्यक्ति हैं।",
4:"आप व्यावहारिक, अनुशासित और जीवन में मजबूत आधार बनाने पर केंद्रित रहते हैं।",
5:"आपको स्वतंत्रता, रोमांच और नए अनुभव पसंद हैं। आप बदलावों को आसानी से अपनाते हैं।",
6:"आप जिम्मेदार, दयालु और परिवार व समाज की भलाई को महत्व देने वाले व्यक्ति हैं।",
7:"आप गहराई से सोचने वाले, आध्यात्मिक और ज्ञान की खोज में रुचि रखने वाले व्यक्ति हैं।",
8:"आप महत्वाकांक्षी, आत्मविश्वासी और सफलता प्राप्त करने के लिए निरंतर प्रयासरत रहते हैं।",
9:"आप दयालु, उदार और मानवता की सेवा करने की भावना रखने वाले व्यक्ति हैं।"
};

if(language === "en"){

document.getElementById("result").innerHTML =
"<h2>✨ Your Life Path Number is: "+sum+"</h2>" +
"<h3>"+englishTitles[sum]+"</h3>" +
"<hr>" +
"<p>"+englishMeanings[sum]+"</p>";

}else{

document.getElementById("result").innerHTML =
"<h2>✨ आपका लाइफ पाथ नंबर है: "+sum+"</h2>" +
"<h3>"+hindiTitles[sum]+"</h3>" +
"<hr>" +
"<p>"+hindiMeanings[sum]+"</p>";

}

}

document.getElementById("language").addEventListener("change", function(){

let lang = this.value;

if(lang === "hi"){
document.getElementById("tagline").innerText =
"अंक ज्योतिष के माध्यम से अपने व्यक्तित्व, क्षमताओं और जीवन उद्देश्य को जानें।";

document.getElementById("calcBtn").innerText =
"लाइफ पाथ नंबर जानें";

}else{

document.getElementById("tagline").innerText =
"Unlock your personality, strengths, and life purpose through numerology.";

document.getElementById("calcBtn").innerText =
"Calculate Life Path Number";

}

});

</script>

</body>
