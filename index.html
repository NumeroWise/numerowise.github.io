<!DOCTYPE html>

<div class="container">

<script>

if(!dob){
alert("Please select your date of birth");

}

let sum = digits.split('').reduce((a,b)=>a+parseInt(b),0);

sum = sum.toString().split('').reduce((a,b)=>a+parseInt(b),0);
}

2: "You are cooperative, diplomatic, and value harmony in relationships.<br><br>आप सहयोगी, समझदार और रिश्तों में संतुलन बनाए रखने वाले व्यक्ति हैं।",

3: "You are creative, expressive, and enjoy inspiring others.<br><br>आप रचनात्मक, अभिव्यक्तिशील और दूसरों को प्रेरित करने वाले व्यक्ति हैं।",
