<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personality Number Calculator | NumeroWise</title>

<meta name="description" content="Free Personality Number Calculator. Discover how others see you, your outer personality, first impressions, and social image through numerology.">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="header"></div>

<div class="container">

<h1>Personality Number Calculator</h1>

<div class="subtitle">
Discover how others perceive you through numerology
</div>

<div class="card">

<input
type="text"
id="name"
placeholder="Enter Full Name">

<button onclick="calculate()">
Calculate Personality Number
</button>

<div class="result" id="resultBox">

<div class="label">
Your Personality Number
</div>

<div
class="number"
id="personalityNumber"
onclick="goDetail()">
</div>

<div class="result-summary" id="summary">
Your Personality Number reflects how others perceive you. CLICK Personality Number to Know More...
</div>

</div>

</div>

</div>

<div id="footer"></div>

<script>

let finalNumber = null;

/* PYTHAGOREAN VALUES */

const values = {
A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,
J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,
S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8
};

/* VOWELS */

const vowels = ["A","E","I","O","U"];

/* REDUCE TO SINGLE DIGIT */

function reduceToSingleDigit(num){

while(num > 9){

num = num
.toString()
.split("")
.reduce(
(sum,digit)=>sum + Number(digit),
0
);

}

return num;

}

/* PERSONALITY NUMBER */

function calculatePersonality(name){

name =
name
.toUpperCase()
.replace(/[^A-Z]/g,'');

let sum = 0;

for(let char of name){

if(!vowels.includes(char)){

sum += values[char];

}

}

return reduceToSingleDigit(sum);

}

/* BUTTON */

function calculate(){

let name =
document
.getElementById("name")
.value;

if(!name){

alert("Please enter your full name");

return;

}

finalNumber =
calculatePersonality(name);

document
.getElementById("personalityNumber")
.innerText = finalNumber;

document
.getElementById("resultBox")
.style.display = "block";

}

/* RESULT PAGE */

function goDetail(){

if(finalNumber !== null){

window.location.href =
"personality-number-" +
finalNumber +
".html";

}

}

/* HEADER */

fetch('components/header.html')
.then(response => response.text())
.then(data => {
document.getElementById('header').innerHTML = data;
});

/* FOOTER */

fetch('components/footer.html')
.then(response => response.text())
.then(data => {
document.getElementById('footer').innerHTML = data;
});

</script>

</body>
</html>
